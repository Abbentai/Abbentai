
name: Update YoRHa Cards

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          path: profile

      - name: Checkout YoRHa generator
        uses: actions/checkout@v4
        with:
          repository: yorha-dev/yorha_card_generator
          path: generator
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Generate cards
        working-directory: generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python generator.py --username "$GITHUB_REPOSITORY_OWNER"

      - name: Copy generated cards
        run: |
          mkdir -p profile/assets
          cp generator/output/*.svg profile/assets/

      - name: Commit and push updated cards
        working-directory: profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/

          if ! git diff --cached --quiet; then
            git commit -m "chore: update YoRHa cards"
            git push
          fi
